name: Release

# A tag v* builds the package and publishes it to PyPI as memory-core-lib, with PyPI's trusted publishing
# (no token stored here). Set up once on PyPI: project memory-core-lib -> Publishing -> GitHub, owner
# JikunLiu101, repository memory-core, workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
